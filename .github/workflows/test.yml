name: Tests

on:
  pull_request:
  push:
    branches: [main]

# Supersede older runs of the same PR; keep every run on main so each merged
# commit gets a verdict.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  test:
    name: Compile, format and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Erlang/Elixir (versions from .tool-versions)
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      # restore/save are split so the cache is also saved when the job fails:
      # the next push of a red PR then recompiles only what changed.
      - name: Restore deps and build cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Create databases and the event store schema
        run: mix db.create

      - name: Initialise databases (system, event store, projections)
        run: mix db.init

      - name: Run tests (browser e2e tests excluded, see test_helper.exs)
        run: mix test --exclude e2e

      - name: Save deps and build cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            deps
            _build
          key: ${{ steps.cache.outputs.cache-primary-key }}
